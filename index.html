<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>FonarikApp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0a0a0a;--card:rgba(255,255,255,0.04);--card2:rgba(255,255,255,0.08);
  --bd:rgba(255,255,255,0.08);--bd2:rgba(255,255,255,0.16);
  --tx:#fff;--tx2:rgba(255,255,255,0.55);--tx3:rgba(255,255,255,0.3);
  --gold:#ffd84d;--blur:blur(30px) saturate(150%);
  --e:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;font-family:'Inter',-apple-system,sans-serif}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);overscroll-behavior:none;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column}
#bg{position:fixed;inset:0;z-index:-2;background:linear-gradient(180deg,#0a0a0a,#050505);overflow:hidden}
#bg .orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;will-change:transform}
#bg .o1{width:400px;height:400px;background:#5da9ff;top:-100px;left:-100px;animation:o1 25s ease-in-out infinite}
#bg .o2{width:350px;height:350px;background:#b07fff;top:40%;right:-120px;animation:o2 30s ease-in-out infinite}
#bg .o3{width:450px;height:450px;background:#5dff95;bottom:-150px;left:20%;animation:o3 35s ease-in-out infinite}
@keyframes o1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(120px,80px) scale(1.2)}}
@keyframes o2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-100px,60px) scale(.9)}}
@keyframes o3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-80px,-120px) scale(1.15)}}
#header{padding:14px 16px;display:flex;align-items:center;gap:10px;background:rgba(0,0,0,0.6);backdrop-filter:var(--blur);border-bottom:1px solid var(--bd);z-index:10}
#logo{font-size:16px;font-weight:800;display:flex;align-items:center;gap:9px}
#logo .dot{width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 12px #fff;flex-shrink:0}
.badge{margin-left:auto;font-size:10px;font-weight:800;padding:5px 11px;border-radius:20px;background:var(--card2);border:1px solid var(--bd2);color:var(--tx2)}
#searchBox{padding:10px 14px;background:rgba(0,0,0,0.4);backdrop-filter:var(--blur);border-bottom:1px solid var(--bd)}
#search{width:100%;padding:12px 16px;border-radius:12px;background:var(--card);border:1px solid var(--bd);color:#fff;font-size:14px;font-weight:500;outline:none}
#search:focus{border-color:rgba(255,255,255,0.3);background:var(--card2)}
#search::placeholder{color:var(--tx3)}
#tabs{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;background:rgba(0,0,0,0.4);backdrop-filter:var(--blur);border-bottom:1px solid var(--bd);scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 15px;border-radius:20px;background:var(--card);border:1px solid var(--bd);font-size:12px;font-weight:700;color:var(--tx2);cursor:pointer;white-space:nowrap;flex-shrink:0}
.tab:active{transform:scale(.9)}
.tab.active{background:#fff;color:#000;border-color:#fff;font-weight:900}
.tab .cnt{opacity:.6;margin-left:5px;font-size:10px}
#subcats{display:none;gap:7px;padding:9px 14px;overflow-x:auto;background:rgba(0,0,0,0.3);backdrop-filter:var(--blur);border-bottom:1px solid var(--bd);scrollbar-width:none}
#subcats.show{display:flex}
#subcats::-webkit-scrollbar{display:none}
.subcat{padding:7px 14px;border-radius:16px;background:var(--card);border:1px solid var(--bd);font-size:11px;font-weight:700;color:var(--tx2);cursor:pointer;white-space:nowrap;flex-shrink:0}
.subcat.active{background:#fff;color:#000;border-color:#fff}
#content{flex:1;overflow-y:auto;padding:12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#content::-webkit-scrollbar{display:none}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);backdrop-filter:var(--blur);border:1px solid var(--bd);border-radius:14px;overflow:hidden;cursor:pointer;animation:cIn .4s var(--e) backwards;position:relative}
@keyframes cIn{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.card:active{transform:scale(.95);border-color:var(--bd2)}
.card .prev{width:100%;aspect-ratio:3/4;background:#111;display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden}
.card .prev img{width:100%;height:100%;object-fit:cover;display:block}
.card .info{padding:10px 12px;background:rgba(0,0,0,0.3);border-top:1px solid var(--bd)}
.card .name{font-size:12.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.card .sub{font-size:10.5px;color:var(--tx3);margin-top:4px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;padding:60px 20px;color:var(--tx3)}
.empty .big{font-size:60px;margin-bottom:14px;opacity:.6}
.empty .ttl{font-size:15px;font-weight:800;color:var(--tx)}
.empty .sub{font-size:12px;margin-top:8px}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-20px);background:rgba(20,20,20,0.95);border:1px solid var(--bd2);color:#fff;padding:12px 22px;border-radius:99px;font-size:12.5px;font-weight:700;opacity:0;transition:opacity .25s,transform .25s var(--spring);pointer-events:none;z-index:9999}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#modal{position:fixed;inset:0;z-index:500;display:none;align-items:flex-end;justify-content:center}
#modal.show{display:flex}
#mBg{position:absolute;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(12px)}
#mSheet{position:relative;width:100%;max-width:540px;background:linear-gradient(180deg,#141414,#0a0a0a);border:1px solid var(--bd2);border-bottom:none;border-radius:24px 24px 0 0;padding:18px 18px 26px;transform:translateY(100%);transition:transform .45s var(--spring);max-height:88vh;overflow-y:auto}
#modal.show #mSheet{transform:translateY(0)}
.handle{width:38px;height:4px;border-radius:3px;background:rgba(255,255,255,0.3);margin:0 auto 16px}
.mTitle{font-size:19px;font-weight:900;margin-bottom:12px;text-align:center}
.mPrev{width:100%;aspect-ratio:9/16;max-height:280px;border-radius:16px;background:#111;display:flex;align-items:center;justify-content:center;font-size:64px;margin-bottom:14px;overflow:hidden}
.mPrev img{width:100%;height:100%;object-fit:contain}
.mRow{display:flex;justify-content:space-between;gap:14px;padding:11px 14px;background:var(--card);border:1px solid var(--bd);border-radius:11px;margin-bottom:6px;font-size:12.5px;font-weight:600}
.mRow span:first-child{color:var(--tx3)}
.mRow .v{color:#fff;text-align:right;word-break:break-word;font-weight:700}
.btn{width:100%;padding:15px;border-radius:14px;border:none;background:#fff;color:#000;font-weight:900;font-size:14px;cursor:pointer;margin-top:10px}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card);color:#fff;border:1px solid var(--bd2)}
#splash{position:fixed;inset:0;z-index:2000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;background:#0a0a0a;transition:opacity .6s}
#splash.hide{opacity:0;pointer-events:none}
.splash-icon{width:80px;height:80px;border-radius:24px;background:rgba(255,255,255,0.06);border:1px solid var(--bd2);display:flex;align-items:center;justify-content:center;margin-bottom:24px;font-size:42px;animation:splashFloat 3s ease-in-out infinite}
@keyframes splashFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.splash-title{font-size:22px;font-weight:900;margin-bottom:12px}
.splash-text{font-size:13px;color:var(--tx2);line-height:1.6;max-width:320px}
.splash-loader{margin-top:34px;width:60px;height:3px;border-radius:2px;background:rgba(255,255,255,0.1);overflow:hidden}
.splash-loader-fill{height:100%;width:0%;background:#fff;animation:splashLoad 2s ease-out forwards}
@keyframes splashLoad{to{width:100%}}
</style>
</head>
<body>

<div id="bg"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>

<div id="splash">
  <div class="splash-icon">🟡</div>
  <div class="splash-title">FonarikApp</div>
  <div class="splash-text">Каталог обоев, плагинов и тем для Telegram</div>
  <div class="splash-loader"><div class="splash-loader-fill"></div></div>
</div>

<div id="header">
  <div id="logo"><div class="dot"></div><span>FonarikApp</span></div>
  <div class="badge">FREE</div>
</div>

<div id="searchBox"><input id="search" placeholder="Поиск"></div>
<div id="tabs"></div>
<div id="subcats"></div>

<div id="content">
  <div class="empty"><div class="big">⏳</div><div class="ttl">Загрузка</div><div class="sub">Подожди</div></div>
</div>

<div id="modal">
  <div id="mBg"></div>
  <div id="mSheet"><div class="handle"></div><div id="mContent"></div></div>
</div>

<div id="toast"></div>

<script>
// @ts-nocheck
const BOT_URL = "https://fonarikkapp-bot.onrender.com";
const $ = s => document.querySelector(s);

try { if (window.Telegram && window.Telegram.WebApp) { window.Telegram.WebApp.ready(); window.Telegram.WebApp.expand(); } } catch(e){}

let DATA = { themes: [], wallpapers: [], plugins: [] };
let MAIN_CAT = "all";
let QUERY = "";
let USER_ID = null;

try {
  if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe) {
    const u = window.Telegram.WebApp.initDataUnsafe.user;
    if (u && u.id) USER_ID = u.id;
  }
} catch(e){}

function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(window._t); window._t=setTimeout(()=>t.classList.remove("show"),2000); }

function renderTabs(){
  const tabs = [
    { k:"all", n:"Всё", cnt: DATA.themes.length + DATA.wallpapers.length + DATA.plugins.length },
    { k:"themes", n:"Темы", cnt: DATA.themes.length },
    { k:"wallpapers", n:"Обои", cnt: DATA.wallpapers.length },
    { k:"plugins", n:"Плагины", cnt: DATA.plugins.length }
  ];
  $("#tabs").innerHTML = tabs.map(t => `<div class="tab ${MAIN_CAT===t.k?'active':''}" data-k="${t.k}">${t.n}<span class="cnt">${t.cnt}</span></div>`).join("");
  document.querySelectorAll("#tabs .tab").forEach(el => el.onclick = () => { MAIN_CAT = el.dataset.k; renderTabs(); renderSubcats(); renderList(); });
}

function renderSubcats(){
  if (MAIN_CAT !== "wallpapers") { $("#subcats").classList.remove("show"); return; }
  const counts = {};
  DATA.wallpapers.forEach(w => { const c = w.category || "other"; counts[c] = (counts[c]||0)+1; });
  const items = [{k:"all", n:"Все", cnt:DATA.wallpapers.length}];
  Object.keys(counts).forEach(c => items.push({k:c, n:c, cnt:counts[c]}));
  $("#subcats").innerHTML = items.map(i => `<div class="subcat ${i.k==='all'?'active':''}" data-k="${i.k}">${i.n} ${i.cnt}</div>`).join("");
  $("#subcats").classList.add("show");
  document.querySelectorAll("#subcats .subcat").forEach(el => el.onclick = () => {
    document.querySelectorAll("#subcats .subcat").forEach(x => x.classList.remove("active"));
    el.classList.add("active");
    renderList(el.dataset.k);
  });
}

let SUB_FILTER = "all";
function renderList(sub){
  if (sub) SUB_FILTER = sub;
  const content = $("#content");
  let items = [];
  if (MAIN_CAT === "all" || MAIN_CAT === "themes") DATA.themes.forEach(t => items.push({type:"theme", ...t}));
  if (MAIN_CAT === "all" || MAIN_CAT === "wallpapers") DATA.wallpapers.forEach(w => { if (SUB_FILTER !== "all" && w.category !== SUB_FILTER) return; items.push({type:"wallpaper", ...w}); });
  if (MAIN_CAT === "all" || MAIN_CAT === "plugins") DATA.plugins.forEach(p => items.push({type:"plugin", ...p}));
  if (QUERY) { const q = QUERY.toLowerCase(); items = items.filter(i => (i.name||"").toLowerCase().includes(q) || (i.desc||"").toLowerCase().includes(q)); }
  if (!items.length) { content.innerHTML = `<div class="empty"><div class="big">🕳️</div><div class="ttl">Пусто</div><div class="sub">Ничего не найдено</div></div>`; return; }
  content.innerHTML = `<div class="grid">${items.map((it, i) => {
    const ico = it.type === "theme" ? "🎨" : it.type === "wallpaper" ? "🖼️" : "🔌";
    const prev = it.preview ? `<img src="${it.preview}" loading="lazy" onerror="this.style.display='none'">` : ico;
    return `<div class="card" data-i="${i}" style="animation-delay:${Math.min(i*20,300)}ms">
      <div class="prev">${prev}</div>
      <div class="info"><div class="name">${it.name||"—"}</div><div class="sub">${it.author||it.desc||""}</div></div>
    </div>`;
  }).join("")}</div>`;
  document.querySelectorAll(".card").forEach(el => el.onclick = () => openItem(items[+el.dataset.i]));
}

function openItem(it){
  const ico = it.type === "theme" ? "🎨" : it.type === "wallpaper" ? "🖼️" : "🔌";
  const prev = it.preview ? `<img src="${it.preview}" onerror="this.style.display='none'">` : ico;
  const isPlugin = it.type === "plugin";
  $("#mContent").innerHTML = `
    <div class="mPrev">${prev}</div>
    <div class="mTitle">${it.name||"—"}</div>
    ${it.author ? `<div class="mRow"><span>Автор</span><span class="v">${it.author}</span></div>` : ""}
    ${it.client ? `<div class="mRow"><span>Клиент</span><span class="v">${it.client}</span></div>` : ""}
    ${it.desc ? `<div class="mRow"><span>Описание</span><span class="v">${it.desc}</span></div>` : ""}
    ${isPlugin ? `<button class="btn" id="install">📥 Установить</button>` : ""}
    <button class="btn ghost" id="dl">💾 Скачать</button>
    <button class="btn ghost" id="close">Закрыть</button>
  `;
  if (isPlugin) $("#install").onclick = () => installViaBot(it);
  $("#dl").onclick = () => { if (it.file) window.open(it.file, "_blank"); };
  $("#close").onclick = () => $("#modal").classList.remove("show");
  $("#modal").classList.add("show");
}

async function installViaBot(it){
  if (!it.file) { toast("Файл не указан"); return; }
  if (!USER_ID) { toast("Не удалось получить ID"); return; }
  $("#modal").classList.remove("show");
  toast("Отправляю...");
  try {
    const res = await fetch(BOT_URL + "/install", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ user_id: USER_ID, file: it.file, name: it.name||"Файл", type: it.type||"plugin" })
    });
    const data = await res.json();
    if (data.ok) { toast("✅ Отправлено в бота"); setTimeout(()=>{ try{window.Telegram.WebApp.close();}catch(e){} }, 1500); }
    else toast("❌ Ошибка");
  } catch(e) { toast("❌ " + e.message); }
}

$("#mBg").onclick = () => $("#modal").classList.remove("show");
let sT;
$("#search").addEventListener("input", e => { clearTimeout(sT); sT = setTimeout(() => { QUERY = e.target.value.trim(); renderList(); }, 150); });

async function loadData(){
  try {
    const r = await fetch("data.json?t=" + Date.now());
    if (!r.ok) throw new Error("HTTP " + r.status);
    DATA = await r.json();
    if (!DATA.themes) DATA.themes = [];
    if (!DATA.wallpapers) DATA.wallpapers = [];
    if (!DATA.plugins) DATA.plugins = [];
    renderTabs(); renderSubcats(); renderList();
  } catch(e) {
    $("#content").innerHTML = `<div class="empty"><div class="big">⚠️</div><div class="ttl">Ошибка загрузки</div><div class="sub">${e.message}</div><button class="btn" onclick="location.reload()" style="max-width:240px;margin:20px auto 0">Повторить</button></div>`;
  }
}

setTimeout(()=>{ $("#splash").classList.add("hide"); setTimeout(()=>$("#splash").remove(), 700); }, 2500);
loadData();
</script>
</body>
</html>
