<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>FonarikApp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#000;
  --dot:rgba(255,255,255,0.07);
  --bd:rgba(255,255,255,0.10);
  --bd2:rgba(255,255,255,0.22);
  --tx:#fff;
  --tx2:rgba(255,255,255,0.55);
  --tx3:rgba(255,255,255,0.28);
  --red:#ff2d2d;
  --e:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --fd:'DotGothic16','Space Mono',monospace;
  --fm:'Space Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{
  height:100%;overflow:hidden;background:#000;color:var(--tx);
  overscroll-behavior:none;font-family:var(--fd);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeSpeed;
}
body{display:flex;flex-direction:column;position:relative}

/* ===== ФОН С ТОЧКАМИ ===== */
#wall{position:fixed;inset:0;z-index:-2;background:#000;overflow:hidden}
#wall::before{
  content:'';position:absolute;inset:-10%;
  background-image:radial-gradient(circle, var(--dot) 1px, transparent 1px);
  background-size:18px 18px;
  animation:dotDrift 80s linear infinite;
  will-change:background-position;
}
@keyframes dotDrift{from{background-position:0 0}to{background-position:180px 360px}}
#wall::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 50% 50%, transparent 30%, #000 90%);
  pointer-events:none;
}

/* ===== HEADER ===== */
#header{
  padding:16px 18px;display:flex;align-items:center;gap:12px;
  background:rgba(0,0,0,0.85);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--bd);z-index:10;
  position:relative;
}
#logo{font-size:16px;font-weight:400;letter-spacing:3.5px;display:flex;align-items:center;gap:10px;text-transform:uppercase}
#logo .dot{
  width:10px;height:10px;border-radius:50%;background:#fff;
  box-shadow:0 0 12px rgba(255,255,255,0.9);
  animation:dotPulse 2s ease-in-out infinite;
  position:relative;flex-shrink:0;
}
#logo .dot::after{
  content:'';position:absolute;inset:-4px;border-radius:50%;
  border:1px solid rgba(255,255,255,0.3);
  animation:dotRing 2s ease-in-out infinite;
}
@keyframes dotPulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes dotRing{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.6);opacity:0}}
.badge{
  margin-left:auto;font-size:9px;font-weight:700;
  padding:5px 11px;border-radius:2px;
  background:#fff;color:#000;
  letter-spacing:3px;font-family:var(--fm);
  text-transform:uppercase;flex-shrink:0;
}

/* ===== SEARCH ===== */
#searchBox{padding:12px 16px;background:#000;border-bottom:1px solid var(--bd)}
#search{
  width:100%;padding:13px 16px;
  border-radius:2px;background:transparent;
  border:1px solid var(--bd2);
  color:var(--tx);font-size:13px;outline:none;
  font-family:var(--fd);letter-spacing:1px;
  transition:border-color .2s var(--e),background .2s;
}
#search:focus{border-color:#fff;background:rgba(255,255,255,0.02)}
#search::placeholder{color:var(--tx3);letter-spacing:2.5px;text-transform:uppercase;font-size:10px;font-family:var(--fm)}

/* ===== CATS ===== */
#cats{
  display:flex;gap:0;padding:0;overflow-x:auto;
  background:#000;border-bottom:1px solid var(--bd);
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
#cats::-webkit-scrollbar{display:none}
.cat{
  padding:14px 18px;background:transparent;border:none;
  border-right:1px solid var(--bd);
  font-size:11px;font-weight:400;
  color:var(--tx2);cursor:pointer;white-space:nowrap;
  letter-spacing:2.5px;text-transform:uppercase;
  font-family:var(--fm);
  transition:color .18s,background .18s;
  position:relative;flex-shrink:0;
  -webkit-tap-highlight-color:transparent;
}
.cat:active{background:rgba(255,255,255,0.04)}
.cat.active{color:#fff;background:rgba(255,255,255,0.05)}
.cat.active::after{
  content:'';position:absolute;bottom:-1px;left:0;right:0;height:1px;
  background:#fff;box-shadow:0 0 8px rgba(255,255,255,0.9);
}
.cat .cnt{opacity:.35;margin-left:6px;font-size:9px;color:#fff}

/* ===== SUBCATS ===== */
#subcats{
  display:none;gap:0;padding:0;overflow-x:auto;
  background:#000;border-bottom:1px solid var(--bd);
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
#subcats.show{display:flex}
#subcats::-webkit-scrollbar{display:none}
.subcat{
  padding:11px 15px;background:transparent;border:none;
  border-right:1px solid var(--bd);
  font-size:10px;font-weight:400;color:var(--tx2);
  cursor:pointer;white-space:nowrap;
  letter-spacing:2.5px;text-transform:uppercase;
  font-family:var(--fm);
  transition:color .18s,background .18s;
  position:relative;flex-shrink:0;
}
.subcat:active{background:rgba(255,255,255,0.04)}
.subcat.active{color:#fff;background:rgba(255,255,255,0.05)}
.subcat.active::after{
  content:'';position:absolute;bottom:-1px;left:0;right:0;height:1px;
  background:#fff;box-shadow:0 0 8px rgba(255,255,255,0.9);
}
.subcat .cnt{opacity:.35;margin-left:5px;font-size:9px}

/* ===== CONTENT ===== */
#content{
  flex:1;overflow-y:auto;padding:14px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
}
#content::-webkit-scrollbar{display:none}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}

/* ===== CARDS ===== */
.card{
  background:#000;border:1px solid var(--bd);
  border-radius:2px;overflow:hidden;cursor:pointer;
  transition:transform .2s var(--spring),border-color .25s,box-shadow .25s;
  animation:cIn .4s var(--e) backwards;
  contain:layout style paint;
  content-visibility:auto;
  contain-intrinsic-size:200px 300px;
  position:relative;
  -webkit-tap-highlight-color:transparent;
}
@keyframes cIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.card:active{
  transform:scale(.96);
  border-color:#fff;
  box-shadow:0 0 24px rgba(255,255,255,0.18);
}
.card .prev{
  width:100%;aspect-ratio:3/4;background:#0a0a0a;
  display:flex;align-items:center;justify-content:center;
  font-size:44px;overflow:hidden;position:relative;
}
.card .prev::before{
  content:'';position:absolute;inset:0;
  background-image:radial-gradient(circle, rgba(255,255,255,0.045) 1px, transparent 1px);
  background-size:10px 10px;pointer-events:none;z-index:1;
}
.card .prev img{
  width:100%;height:100%;object-fit:cover;display:block;
  position:relative;z-index:0;
  transition:transform .4s var(--e);
  filter:grayscale(15%) contrast(1.05);
}
.card:active .prev img{transform:scale(1.05)}
.card .info{padding:11px 12px;border-top:1px solid var(--bd)}
.card .name{
  font-size:12px;font-weight:400;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  letter-spacing:1.5px;text-transform:uppercase;color:#fff;
}
.card .sub{
  font-size:9px;color:var(--tx3);margin-top:5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  letter-spacing:2px;text-transform:uppercase;font-family:var(--fm);
}

/* ===== SKELETON ===== */
.skeleton{background:#000;border:1px solid var(--bd);border-radius:2px;overflow:hidden}
.skeleton .sk-prev{
  width:100%;aspect-ratio:3/4;
  background:linear-gradient(90deg,#050505 0%,#0e0e0e 50%,#050505 100%);
  background-size:200% 100%;animation:sk 1.4s ease-in-out infinite;
}
.skeleton .sk-info{padding:11px 12px;border-top:1px solid var(--bd)}
.skeleton .sk-line{
  height:10px;background:linear-gradient(90deg,#050505 0%,#0e0e0e 50%,#050505 100%);
  background-size:200% 100%;animation:sk 1.4s ease-in-out infinite;
}
.skeleton .sk-line.short{width:55%;margin-top:8px;height:8px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ===== EMPTY ===== */
.empty{text-align:center;padding:70px 20px;color:var(--tx3)}
.empty .big{
  font-size:56px;margin-bottom:22px;
  animation:emptyFloat 3s ease-in-out infinite;opacity:.5;
}
@keyframes emptyFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.empty .ttl{font-size:13px;font-weight:400;color:var(--tx);letter-spacing:4px;text-transform:uppercase}
.empty .sub{font-size:10px;margin-top:12px;letter-spacing:2px;text-transform:uppercase;font-family:var(--fm)}

/* ===== TOAST ===== */
#toast{
  position:fixed;top:70px;left:50%;
  transform:translateX(-50%) translateY(-20px);
  background:#000;border:1px solid #fff;color:#fff;
  padding:12px 22px;border-radius:2px;
  font-size:11px;font-weight:400;
  letter-spacing:2px;text-transform:uppercase;
  font-family:var(--fm);
  opacity:0;transition:opacity .25s var(--e),transform .25s var(--spring);
  pointer-events:none;z-index:999;
  box-shadow:0 0 24px rgba(255,255,255,0.18);
  max-width:90%;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== MODAL ===== */
#modal{position:fixed;inset:0;z-index:500;display:none;align-items:flex-end;justify-content:center}
#modal.show{display:flex}
#mBg{
  position:absolute;inset:0;background:rgba(0,0,0,0.85);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  opacity:0;transition:opacity .3s var(--e);
}
#modal.show #mBg{opacity:1}
#mSheet{
  position:relative;width:100%;max-width:540px;
  background:#000;border:1px solid #fff;border-bottom:none;
  border-radius:2px 2px 0 0;
  padding:22px 20px 30px;
  transform:translateY(100%);
  transition:transform .4s var(--spring);
  max-height:85vh;overflow-y:auto;will-change:transform;
  overscroll-behavior:contain;
}
#modal.show #mSheet{transform:translateY(0)}
.handle{width:44px;height:2px;background:#fff;margin:0 auto 20px;box-shadow:0 0 8px rgba(255,255,255,0.9)}
.mTitle{
  font-size:17px;font-weight:400;margin-bottom:18px;text-align:center;
  letter-spacing:3px;text-transform:uppercase;
  animation:fadeUp .4s var(--e) backwards;animation-delay:.1s;
}
.mPrev{
  width:100%;aspect-ratio:9/16;max-height:320px;
  border:1px solid var(--bd2);border-radius:2px;
  background:#0a0a0a;
  display:flex;align-items:center;justify-content:center;
  font-size:72px;margin-bottom:18px;overflow:hidden;
  animation:fadeUp .4s var(--e) backwards;animation-delay:.05s;
  position:relative;
}
.mPrev::before{
  content:'';position:absolute;inset:0;
  background-image:radial-gradient(circle, rgba(255,255,255,0.045) 1px, transparent 1px);
  background-size:10px 10px;pointer-events:none;z-index:1;
}
.mPrev img{width:100%;height:100%;object-fit:contain;position:relative;z-index:0}
.mRow{
  display:flex;justify-content:space-between;gap:14px;
  padding:14px 0;border-bottom:1px solid var(--bd);
  font-size:11px;font-weight:400;letter-spacing:1.5px;
  animation:fadeUp .4s var(--e) backwards;animation-delay:.15s;
}
.mRow span:first-child{
  color:var(--tx3);flex-shrink:0;
  text-transform:uppercase;font-family:var(--fm);
  font-size:10px;letter-spacing:2px;
}
.mRow .v{color:#fff;text-align:right;word-break:break-word;font-weight:400}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* ===== BTN ===== */
.btn{
  width:100%;padding:18px;border-radius:2px;
  border:1px solid #fff;background:#fff;color:#000;
  font-weight:400;font-size:12px;cursor:pointer;margin-top:12px;
  transition:transform .15s var(--spring),box-shadow .25s;
  position:relative;overflow:hidden;
  animation:fadeUp .4s var(--e) backwards;animation-delay:.2s;
  font-family:var(--fm);letter-spacing:3px;text-transform:uppercase;
  box-shadow:0 0 20px rgba(255,255,255,0.12);
  -webkit-tap-highlight-color:transparent;
}
.btn:active{transform:scale(.97);box-shadow:0 0 32px rgba(255,255,255,0.35)}
.btn.ghost{background:transparent;color:#fff;border:1px solid var(--bd2);box-shadow:none}
.btn.ghost:active{background:rgba(255,255,255,0.05);border-color:#fff}

.ripple{
  position:absolute;border-radius:0;background:rgba(0,0,0,0.15);
  transform:scale(0);animation:rippleAnim .6s ease-out;pointer-events:none;
}
.btn.ghost .ripple{background:rgba(255,255,255,0.15)}
@keyframes rippleAnim{to{transform:scale(4);opacity:0}}

/* ===== SPLASH ПРИВЕТСТВИЕ ===== */
#splash{
  position:fixed;inset:0;z-index:2000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:30px;text-align:center;background:#000;
  transition:opacity .6s ease,transform .6s ease;
}
#splash::before{
  content:'';position:absolute;inset:-10%;
  background-image:radial-gradient(circle, rgba(255,255,255,0.06) 1px, transparent 1px);
  background-size:16px 16px;
  animation:dotDrift 50s linear infinite;
}
#splash.hide{opacity:0;transform:scale(1.05);pointer-events:none}
.splash-icon{
  font-size:0;margin-bottom:32px;position:relative;
  width:88px;height:88px;border-radius:50%;
  border:1px solid #fff;
  display:flex;align-items:center;justify-content:center;
  animation:splashFloat 3s ease-in-out infinite;
  box-shadow:0 0 48px rgba(255,255,255,0.4),inset 0 0 24px rgba(255,255,255,0.08);
}
.splash-icon::before{
  content:'';position:absolute;width:14px;height:14px;border-radius:50%;
  background:#fff;box-shadow:0 0 24px rgba(255,255,255,1);
  animation:dotPulse 1.5s ease-in-out infinite;
}
.splash-icon::after{
  content:'';position:absolute;inset:-12px;border-radius:50%;
  border:1px solid rgba(255,255,255,0.2);
  animation:dotRing 2s ease-in-out infinite;
}
@keyframes splashFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.splash-title{
  font-size:20px;font-weight:400;
  letter-spacing:4px;text-transform:uppercase;
  margin-bottom:18px;line-height:1.5;
  opacity:0;animation:fadeUp .6s ease .2s forwards;
  max-width:340px;position:relative;
}
.splash-text{
  font-size:11px;font-weight:400;color:rgba(255,255,255,0.5);
  line-height:1.8;max-width:320px;
  letter-spacing:1.5px;text-transform:uppercase;
  font-family:var(--fm);
  opacity:0;animation:fadeUp .6s ease .4s forwards;position:relative;
}
.splash-thanks{
  margin-top:26px;font-size:10px;
  letter-spacing:3px;text-transform:uppercase;
  color:rgba(255,255,255,0.7);
  opacity:0;animation:fadeUp .6s ease .6s forwards;
  position:relative;font-family:var(--fm);
}
.splash-loader{
  margin-top:44px;width:64px;height:1px;
  background:rgba(255,255,255,0.1);overflow:hidden;
  opacity:0;animation:fadeUp .6s ease .8s forwards;
  position:relative;
}
.splash-loader-fill{
  height:100%;width:0%;background:#fff;
  animation:splashLoad 2s ease-out .8s forwards;
  box-shadow:0 0 12px rgba(255,255,255,0.9);
}
@keyframes splashLoad{from{width:0%}to{width:100%}}

/* ===== INSTALL SPLASH ===== */
#installSplash{
  position:fixed;inset:0;z-index:3000;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:30px;text-align:center;gap:18px;
  background:rgba(0,0,0,0.98);
  backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
  opacity:0;transition:opacity .3s var(--e);
}
#installSplash.show{display:flex;opacity:1}
#installSplash::before{
  content:'';position:absolute;inset:0;
  background-image:radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px);
  background-size:14px 14px;
}
.install-icon{
  font-size:0;position:relative;
  width:88px;height:88px;border-radius:50%;
  border:1px solid #fff;
  display:flex;align-items:center;justify-content:center;
  animation:installPulse 1s ease-in-out infinite;
  box-shadow:0 0 48px rgba(255,255,255,0.5);
}
.install-icon::before{content:'✓';font-size:40px;color:#fff;font-family:var(--fd);line-height:1}
@keyframes installPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.install-title{
  font-size:16px;font-weight:400;
  letter-spacing:3px;text-transform:uppercase;
  position:relative;
}
.install-text{
  font-size:11px;color:rgba(255,255,255,0.6);
  line-height:1.8;max-width:320px;
  letter-spacing:1.5px;text-transform:uppercase;
  font-family:var(--fm);position:relative;
}
.install-hint{
  font-size:10px;color:rgba(255,255,255,0.4);
  margin-top:8px;letter-spacing:2px;text-transform:uppercase;
  font-family:var(--fm);position:relative;
}

/* ===== REDUCED MOTION ===== */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
}
</style>
</head>
<body>

<div id="wall"></div>

<!-- ПРИВЕТСТВИЕ -->
<div id="splash">
  <div class="splash-icon"></div>
  <div class="splash-title">Добро пожаловать</div>
  <div class="splash-text">FonarikApp — каталог обоев, плагинов и тем для Telegram</div>
  <div class="splash-thanks">Спасибо, что выбрал нас</div>
  <div class="splash-loader"><div class="splash-loader-fill"></div></div>
</div>

<!-- ПЛАШКА УСТАНОВКИ -->
<div id="installSplash">
  <div class="install-icon"></div>
  <div class="install-title">Файл отправлен</div>
  <div class="install-text">Открой бота — там будет файл. Тапни на него, чтобы установить.</div>
  <div class="install-hint">Закрытие через 2 сек</div>
</div>

<div id="header">
  <div id="logo"><div class="dot"></div><span>FonarikApp</span></div>
  <div class="badge">Free</div>
</div>

<div id="searchBox">
  <input id="search" type="text" placeholder="Поиск">
</div>

<div id="cats"></div>
<div id="subcats"></div>

<div id="content">
  <div class="grid">
    <div class="skeleton"><div class="sk-prev"></div><div class="sk-info"><div class="sk-line"></div><div class="sk-line short"></div></div></div>
    <div class="skeleton"><div class="sk-prev"></div><div class="sk-info"><div class="sk-line"></div><div class="sk-line short"></div></div></div>
    <div class="skeleton"><div class="sk-prev"></div><div class="sk-info"><div class="sk-line"></div><div class="sk-line short"></div></div></div>
    <div class="skeleton"><div class="sk-prev"></div><div class="sk-info"><div class="sk-line"></div><div class="sk-line short"></div></div></div>
  </div>
</div>

<div id="modal">
  <div id="mBg"></div>
  <div id="mSheet">
    <div class="handle"></div>
    <div id="mContent"></div>
  </div>
</div>

<div id="toast"></div>

<script>
// @ts-nocheck
const BOT_URL = "https://fonarikkapp-bot.onrender.com";

/* ===== TELEGRAM INIT ===== */
try {
  if (window.Telegram && window.Telegram.WebApp) {
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
    if (window.Telegram.WebApp.setHeaderColor) {
      try { window.Telegram.WebApp.setHeaderColor("#000000"); } catch(e){}
    }
    if (window.Telegram.WebApp.disableVerticalSwipes) {
      try { window.Telegram.WebApp.disableVerticalSwipes(); } catch(e){}
    }
  }
} catch(e) {}

const $ = s => document.querySelector(s);
let DATA = { themes: [], wallpapers: [], plugins: [] };
let MAIN_CAT = "all";
let SUB_CAT = "all";
let QUERY = "";
let USER_ID = null;

try {
  if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe) {
    const u = window.Telegram.WebApp.initDataUnsafe.user;
    if (u && u.id) USER_ID = u.id;
    if (u && u.first_name) {
      const t = document.querySelector(".splash-title");
      if (t) t.textContent = "Привет, " + u.first_name;
    }
  }
} catch(e) {}

const COLORS = {
  red:    { n: "Красные" },
  black:  { n: "Чёрные" },
  blue:   { n: "Синие" },
  green:  { n: "Зелёные" },
  white:  { n: "Белые" },
  purple: { n: "Фиолетовые" },
  yellow: { n: "Жёлтые" },
  orange: { n: "Оранжевые" },
  gradient:{ n: "Градиент" },
  dark:   { n: "Тёмные" },
  light:  { n: "Светлые" },
};

/* ===== TOAST ===== */
let toastTimer = null;
function toast(m){
  const t = $("#toast");
  t.textContent = m;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 1600);
}

/* ===== RIPPLE ===== */
document.addEventListener("pointerdown", e => {
  const btn = e.target.closest(".btn");
  if (!btn) return;
  const r = btn.getBoundingClientRect();
  const x = e.clientX - r.left;
  const y = e.clientY - r.top;
  const span = document.createElement("span");
  span.className = "ripple";
  const size = Math.max(r.width, r.height);
  span.style.width = span.style.height = size + "px";
  span.style.left = (x - size/2) + "px";
  span.style.top = (y - size/2) + "px";
  btn.appendChild(span);
  setTimeout(()=>span.remove(), 600);
}, { passive: true });

/* ===== CATS ===== */
function renderCats(){
  const cats = [
    { k:"all",       n:"Всё",     cnt: DATA.themes.length + DATA.wallpapers.length + DATA.plugins.length },
    { k:"themes",    n:"Темы",    cnt: DATA.themes.length },
    { k:"wallpapers",n:"Обои",    cnt: DATA.wallpapers.length },
    { k:"plugins",   n:"Плагины", cnt: DATA.plugins.length },
  ];
  $("#cats").innerHTML = cats.map(c =>
    `<div class="cat ${MAIN_CAT===c.k?'active':''}" data-k="${c.k}">${c.n}<span class="cnt">[${c.cnt}]</span></div>`
  ).join("");
  document.querySelectorAll("#cats .cat").forEach(el => {
    el.onclick = () => {
      MAIN_CAT = el.dataset.k;
      SUB_CAT = "all";
      renderCats();
      renderSubCats();
      renderList();
    };
  });
}

/* ===== SUBCATS ===== */
function renderSubCats(){
  if (MAIN_CAT !== "wallpapers") {
    $("#subcats").classList.remove("show");
    return;
  }
  const counts = {};
  DATA.wallpapers.forEach(w => {
    const c = w.category || "other";
    counts[c] = (counts[c] || 0) + 1;
  });
  const items = [{ k:"all", n:"Все", cnt: DATA.wallpapers.length }];
  Object.keys(counts).forEach(c => {
    if (COLORS[c]) items.push({ k:c, n: COLORS[c].n, cnt: counts[c] });
    else items.push({ k:c, n: c, cnt: counts[c] });
  });
  $("#subcats").innerHTML = items.map(it =>
    `<div class="subcat ${SUB_CAT===it.k?'active':''}" data-k="${it.k}">${it.n}<span class="cnt">[${it.cnt}]</span></div>`
  ).join("");
  $("#subcats").classList.add("show");
  document.querySelectorAll("#subcats .subcat").forEach(el => {
    el.onclick = () => {
      SUB_CAT = el.dataset.k;
      renderSubCats();
      renderList();
    };
  });
}

/* ===== LIST ===== */
function renderList(){
  const content = $("#content");
  let items = [];

  if (MAIN_CAT === "all" || MAIN_CAT === "themes") {
    DATA.themes.forEach(t => items.push({ type:"theme", ...t }));
  }
  if (MAIN_CAT === "all" || MAIN_CAT === "wallpapers") {
    DATA.wallpapers.forEach(w => {
      if (SUB_CAT !== "all" && w.category !== SUB_CAT) return;
      items.push({ type:"wallpaper", ...w });
    });
  }
  if (MAIN_CAT === "all" || MAIN_CAT === "plugins") {
    DATA.plugins.forEach(p => items.push({ type:"plugin", ...p }));
  }

  if (QUERY) {
    const q = QUERY.toLowerCase();
    items = items.filter(i =>
      (i.name || "").toLowerCase().includes(q) ||
      (i.desc || "").toLowerCase().includes(q)
    );
  }

  if (!items.length) {
    content.innerHTML = `
      <div class="empty">
        <div class="big">◯</div>
        <div class="ttl">Пусто</div>
        <div class="sub">${QUERY ? "Ничего не найдено" : "Скоро появятся файлы"}</div>
      </div>`;
    return;
  }

  const html = items.map((it, i) => {
    const ico = it.type === "theme" ? "◉" : it.type === "wallpaper" ? "▣" : "▤";
    const prev = it.preview
      ? `<img src="${it.preview}" loading="lazy" decoding="async" onerror="this.style.display='none'">`
      : ico;
    return `<div class="card" data-i="${i}" style="animation-delay:${Math.min(i*22, 350)}ms">
      <div class="prev">${prev}</div>
      <div class="info">
        <div class="name">${it.name || "—"}</div>
        <div class="sub">${it.author || it.desc || ""}</div>
      </div>
    </div>`;
  }).join("");

  content.innerHTML = `<div class="grid">${html}</div>`;

  document.querySelectorAll(".card").forEach(el => {
    el.onclick = () => openItem(items[+el.dataset.i]);
  });
}

/* ===== OPEN ITEM ===== */
function openItem(it){
  const ico = it.type === "theme" ? "◉" : it.type === "wallpaper" ? "▣" : "▤";
  const prev = it.preview ? `<img src="${it.preview}" onerror="this.style.display='none'">` : ico;
  const catName = COLORS[it.category]?.n || it.category || "";
  const isPlugin = it.type === "plugin";

  $("#mContent").innerHTML = `
    <div class="mPrev">${prev}</div>
    <div class="mTitle">${it.name || "—"}</div>
    ${it.author ? `<div class="mRow"><span>Автор</span><span class="v">${it.author}</span></div>` : ""}
    ${catName ? `<div class="mRow"><span>Категория</span><span class="v">${catName}</span></div>` : ""}
    ${it.client ? `<div class="mRow"><span>Клиент</span><span class="v">${it.client}</span></div>` : ""}
    ${it.desc ? `<div class="mRow"><span>Описание</span><span class="v">${it.desc}</span></div>` : ""}
    ${isPlugin ? `<button class="btn" id="install">Установить</button>` : ""}
    <button class="btn ghost" id="dl">Скачать</button>
    <button class="btn ghost" id="close">Закрыть</button>
  `;

  if (isPlugin) {
    $("#install").onclick = () => installViaBot(it);
  }

  $("#dl").onclick = () => {
    if (it.file) {
      window.open(it.file, "_blank");
      toast("Открываю файл");
    } else {
      toast("Файл не указан");
    }
  };

  $("#close").onclick = () => $("#modal").classList.remove("show");
  $("#modal").classList.add("show");
}

/* ===== INSTALL ===== */
async function installViaBot(it){
  if (!it.file) { toast("Файл не указан"); return; }

  if (!USER_ID) {
    try {
      if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe) {
        const u = window.Telegram.WebApp.initDataUnsafe.user;
        if (u && u.id) USER_ID = u.id;
      }
    } catch(e) {}
  }

  if (!USER_ID) { toast("Не удалось получить ID"); return; }

  $("#modal").classList.remove("show");

  const sp = document.getElementById("installSplash");
  sp.querySelector(".install-icon").textContent = "";
  sp.querySelector(".install-icon").style.setProperty("--x","");
  sp.querySelector(".install-title").textContent = "Отправляю...";
  sp.querySelector(".install-text").innerHTML = "Файл готовится к отправке.";
  sp.querySelector(".install-hint").textContent = "Подожди...";
  sp.classList.add("show");

  let ok = false;
  let errText = "";
  try {
    const res = await fetch(BOT_URL + "/install", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        user_id: USER_ID,
        file: it.file,
        name: it.name || "Файл",
        type: it.type || "plugin"
      })
    });
    const data = await res.json();
    ok = data.ok === true;
    if (!ok) errText = data.error || "unknown";
  } catch(e) {
    errText = e.message;
  }

  if (ok) {
    sp.querySelector(".install-icon").textContent = "";
    sp.querySelector(".install-title").textContent = "Файл отправлен";
    sp.querySelector(".install-text").innerHTML = "Открой бота — там будет файл. Тапни на него, чтобы установить.";
    sp.querySelector(".install-hint").textContent = "Закрытие через 2 сек";
  } else {
    sp.querySelector(".install-icon").textContent = "✕";
    sp.querySelector(".install-title").textContent = "Ошибка";
    sp.querySelector(".install-text").innerHTML = "Не удалось отправить.<br>Попробуй позже.";
    sp.querySelector(".install-hint").textContent = errText;
  }

  setTimeout(() => {
    sp.classList.remove("show");
    setTimeout(() => {
      try {
        if (window.Telegram && window.Telegram.WebApp) window.Telegram.WebApp.close();
      } catch(e) {}
    }, 300);
  }, 2000);
}

/* ===== MODAL BG ===== */
$("#mBg").onclick = () => $("#modal").classList.remove("show");

/* ===== SEARCH ===== */
let searchTimer = null;
$("#search").addEventListener("input", e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    QUERY = e.target.value.trim();
    renderList();
  }, 150);
});

/* ===== LOAD DATA ===== */
async function loadData(){
  try {
    const r = await fetch("data.json?t=" + Date.now());
    if (!r.ok) throw new Error("no data");
    DATA = await r.json();
    if (!DATA.themes) DATA.themes = [];
    if (!DATA.wallpapers) DATA.wallpapers = [];
    if (!DATA.plugins) DATA.plugins = [];
    renderCats();
    renderSubCats();
    renderList();
  } catch(e) {
    $("#content").innerHTML = `
      <div class="empty">
        <div class="big">◯</div>
        <div class="ttl">FonarikApp</div>
        <div class="sub">Скоро здесь появится каталог</div>
      </div>`;
  }
}

/* ===== SPLASH ===== */
(function initSplash(){
  const splash = document.getElementById("splash");
  if (!splash) return;
  setTimeout(()=>{
    splash.classList.add("hide");
    setTimeout(()=>splash.remove(), 700);
  }, 2500);
})();

loadData();
</script>
